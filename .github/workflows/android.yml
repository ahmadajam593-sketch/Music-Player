name: Android Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find project (unzip if needed)
        run: |
          if [ -z "$(find . -name settings.gradle.kts -not -path './.git/*')" ]; then
            for z in $(find . -name '*.zip' -not -path './.git/*'); do unzip -qo "$z"; done
          fi
          S=$(find . -name settings.gradle.kts -not -path './.git/*' | head -n1)
          if [ -z "$S" ]; then echo "settings.gradle.kts not found"; exit 1; fi
          echo "PROJECT_DIR=$(dirname "$S")" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.10.2 }

      - run: gradle assembleDebug
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: Cinema-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
